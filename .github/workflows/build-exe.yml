# お客様に配る exe（MT5Automatic.exe）を、GitHub の Windows で自動で作る。
#
# connect.py や bridge/ を変えて push すると、ここが exe を作り直して
# public/download/MT5Automatic.exe を commit する → Vercel がサイトに載せる。
# 手元の Windows で 3_リリースする.bat を押す必要は無くなる
# （押しても構わない。同じものができる）。
#
# AIリスク監督の合言葉は、リポジトリの Secrets の TRELAB_RISK_TOKEN から入れる
# （Vercel の同名の環境変数と同じ文字列にしておく）。無ければ「切」の exe になる。
name: build-exe

on:
  push:
    branches: [main]
    paths:
      - connect.py
      - bridge/**
      - tools/build-windows.bat
      - tools/splash.png
      - .github/workflows/build-exe.yml
  workflow_dispatch:

concurrency:
  group: build-exe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 英語の Windows なので、日本語の表示でこけないように UTF-8 にする
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # build-windows.bat は `py -3` で呼ぶ。MetaTrader5 の wheel がある版に固定する
      PY_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python の確認
        shell: cmd
        run: py -3 --version

      - name: 合言葉を同梱する（Secrets に無ければ「切」）
        shell: pwsh
        env:
          TRELAB_RISK_TOKEN: ${{ secrets.TRELAB_RISK_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TRELAB_RISK_TOKEN)) {
            Write-Host "::warning::TRELAB_RISK_TOKEN が Secrets に無いので、AIの見張りは「切」の exe になります"
          } else {
            Set-Content -Path bridge/risk_secret.py -Value ('TOKEN = "' + $env:TRELAB_RISK_TOKEN + '"') -Encoding utf8
            Write-Host "合言葉を同梱します"
          }

      - name: EA の控え（ea_manifest.json）を作る
        shell: cmd
        run: py -3 tools\make-ea-manifest.py

      - name: exe を作る
        shell: cmd
        run: cmd /c "tools\build-windows.bat --from-release < NUL"

      - name: できたか確かめる
        shell: pwsh
        run: |
          $exe = "public/download/MT5Automatic.exe"
          if (-not (Test-Path $exe)) { throw "exe ができていません" }
          $size = (Get-Item $exe).Length
          if ($size -lt 20000000) { throw "exe が小さすぎます ($size bytes)" }
          Write-Host "MT5Automatic.exe: $size bytes"

      - name: サイトの置き場へ commit する
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/download/MT5Automatic.exe
          if (git diff --cached --quiet) {
            Write-Host "exe は変わっていません（commit なし）"
            exit 0
          }
          $sha = (git rev-parse --short HEAD)
          git commit -m "[skip ci] exe を作り直す（自動ビルド $sha）"
          # 同じ push で動く Mac 側の自動ビルド（build-mac）が先に commit していることがある。
          # 押し負けたら取り直して、もう一度押す
          for ($i = 1; $i -le 5; $i++) {
            git pull --rebase origin main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "push できなかったので取り直します（$i 回目）"
            Start-Sleep -Seconds 20
          }
          throw "push できませんでした"
