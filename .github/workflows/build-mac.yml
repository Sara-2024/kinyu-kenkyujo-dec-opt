# お客様に配る Mac 版（MT5 Automatic.app）を、GitHub の macOS で自動で作る。
#
# connect.py / connect_mac.py / bridge/ / tools/mac/ を変えて push すると、
#   1. Apple シリコン（macos-15）と Intel（macos-15-intel）で本体を 1 つずつ作り
#   2. 1 つの .app にまとめて public/download/MT5Automatic-mac.zip を commit する
# → Vercel がサイトに載せる（Windows 版の build-exe.yml と同じ流れ）。
#
# 署名はしない（Apple Developer の証明書が要る）。お客様は初回だけ
# 右クリック →「開く」で通す（サイトの手順に書いてある）。
name: build-mac

on:
  push:
    branches: [main]
    paths:
      - connect.py
      - connect_mac.py
      - bridge/**
      - tools/mac/**
      - .github/workflows/build-mac.yml
  workflow_dispatch:

concurrency:
  group: build-mac
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  binary:
    # 機種ごとに本体を作る（PyInstaller は動かしている機種の本体しか作れない）
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 合言葉を同梱する（Secrets に無ければ「切」）
        env:
          TRELAB_RISK_TOKEN: ${{ secrets.TRELAB_RISK_TOKEN }}
        run: |
          if [ -z "$TRELAB_RISK_TOKEN" ]; then
            echo "::warning::TRELAB_RISK_TOKEN が Secrets に無いので、AIの見張りは「切」の版になります"
          else
            printf 'TOKEN = "%s"\n' "$TRELAB_RISK_TOKEN" > bridge/risk_secret.py
            echo "合言葉を同梱します"
          fi

      - name: EA の控え（ea_manifest.json）を作る
        run: python3 tools/make-ea-manifest.py

      - name: 本体を作る（${{ matrix.arch }}）
        run: bash tools/mac/build-mac.sh --binary

      - name: 機種が合っているか確かめる
        run: |
          bin="dist/MT5Automatic-${{ matrix.arch }}"
          test -x "$bin" || { echo "本体ができていません: $bin"; exit 1; }
          file "$bin" | grep -q "${{ matrix.arch }}" || { echo "機種が違います"; file "$bin"; exit 1; }
          # 起動して、引数の処理まで通ることを確かめる（MT5 は無い）
          "$bin" --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: MT5Automatic-${{ matrix.arch }}
          path: dist/MT5Automatic-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  assemble:
    needs: binary
    runs-on: macos-15
    timeout-minutes: 15
    env:
      # macOS ランナーの既定の文字コードだと、日本語の commit メッセージが化ける
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: MT5Automatic-*
          path: dist
          merge-multiple: true

      - name: 2 機種ぶんの本体がそろっているか
        run: |
          chmod +x dist/MT5Automatic-arm64 dist/MT5Automatic-x86_64
          ls -la dist/
          test -x dist/MT5Automatic-arm64 || { echo "Apple シリコン用がありません"; exit 1; }
          test -x dist/MT5Automatic-x86_64 || { echo "Intel 用がありません"; exit 1; }

      - name: .app に包む
        run: bash tools/mac/build-mac.sh --assemble

      - name: できたか確かめる
        run: |
          zip="public/download/MT5Automatic-mac.zip"
          test -f "$zip" || { echo ".zip ができていません"; exit 1; }
          size=$(stat -f%z "$zip")
          echo "MT5Automatic-mac.zip: $size bytes"
          test "$size" -gt 10000000 || { echo ".zip が小さすぎます（2 機種ぶん入っていない？）"; exit 1; }
          ls "dist/MT5 Automatic.app/Contents/Resources/bin/"

      - name: サイトの置き場へ commit する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/download/MT5Automatic-mac.zip
          if git diff --cached --quiet; then
            echo ".zip は変わっていません（commit なし）"
            exit 0
          fi
          sha=$(git rev-parse --short HEAD)
          # bash は「$sha）」の全角かっこを変数名に含めてしまうので ${sha} と書く
          git commit -m "[skip ci] Mac 版を作り直す（自動ビルド ${sha}）"
          # 同じ push で動く Windows 側の自動ビルド（build-exe）が先に commit していることがある。
          # 押し負けたら取り直して、もう一度押す
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push できなかったので取り直します（$i 回目）"
            sleep 20
          done
          echo "push できませんでした"
          exit 1
