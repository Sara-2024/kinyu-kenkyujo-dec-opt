name: test-windows

# Windows の実機で「閉じた MT5 を勝手に開かない／開いたらつながる」を確かめる（bridge/tests/windows_mt5_test.py）。
# 本物の MT5 も黙って入れて、直す前の動き（素の initialize が MT5 を起こす）と比べる。
on:
  push:
    branches: [main]
    paths:
      - bridge/mt5_terminal.py
      - bridge/bridge.py
      - bridge/gold_symbol.py
      - connect.py
      - bridge/tests/windows_mt5_test.py
      - .github/workflows/test-windows.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PY_PYTHON3: "3.12"        # py -3 も 3.12 にする（新しすぎる Python には MetaTrader5 の部品が無い。build-exe.yml と同じ）
      PYTHONUTF8: "1"           # 日本語の出力で落ちないように
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 部品を入れる
        run: python -m pip install --quiet MetaTrader5 websockets python-dotenv
      - name: 本物の MT5 を黙って入れる（入れ終わったら閉じる）
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList "/auto"
          $exe = "C:\Program Files\MetaTrader 5\terminal64.exe"
          for ($i = 0; $i -lt 180 -and -not (Test-Path $exe); $i++) { Start-Sleep -Seconds 2 }
          Start-Sleep -Seconds 20
          Get-Process terminal64, mt5setup -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $exe) { "REAL_MT5=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; Write-Host "MT5 を入れました" } else { Write-Host "::warning::MT5 を入れられませんでした（第 2 部は省きます）" }
      - name: 試験
        run: python bridge/tests/windows_mt5_test.py
      - name: 接続ツールがサイトに届くか（Vercel の bot 対策で門前払いされていないか）
        run: |
          python -c "import urllib.request,urllib.error,json; req=urllib.request.Request('https://kinyu-kenkyujo-dec-opt.vercel.app/api/connect', data=json.dumps({'token':'0'*64}).encode(), headers={'Content-Type':'application/json'}, method='POST')
          try:
              code=urllib.request.urlopen(req, timeout=20).status
          except urllib.error.HTTPError as e:
              code=e.code; print(e.headers.get('x-vercel-mitigated'))
          print('api/connect ->', code); assert code != 403, '接続ツールがサイトに門前払いされています（Vercel の bot 対策）'"
