    mt5steps: () => {
      const idx = flow.mt5Index;
      const steps = [
        ["システムをチャートに載せる", `ナビゲーター →「エキスパートアドバイザ」→ YumekkuEA-1年版 をゴールド（XAUUSD または GOLD）のチャートへドラッグ →「アルゴ取引を許可」にチェック → OK`],
        ["「アルゴ取引」ボタンを ON にする", "MT5 上部のボタンが緑になれば OK（「自動売買」と表示される版もあります）"],
      ];
      return `<ol class="steps steps--live">${steps.map(([t, d], i) => `<li class="${i < idx ? "is-done" : i === idx ? "is-active" : ""}"><span><b>${esc(t)}</b><br>${esc(d)}</span></li>`).join("")}</ol>
        ${flow.problem ? `<p class="err">${esc(flow.problem)}</p>` : ""}
        <ul class="prog"><li class="is-wait">MT5 の画面を見ています… 終わると自動で進みます</li></ul>`;
    },
    members: () => `<ul class="prog prog--members">${members.map((m, i) => `
        <li class="${m.done ? "is-ok" : "is-ng"}"><span>口座 ${esc(tail2(m.account))}${m.name ? `（${esc(m.name)}）` : ""}　${m.done ? "接続済み" : "未接続"}</span>
          <button type="button" class="mini" data-reconnect="${i}">${m.done ? "つなぎ直す" : "続きから"}</button></li>`).join("")}</ul>`,
  };

  /* ── サイトの窓口に頼む（/api/lobby） ── */
  const api = async (body) => {
    if (isTodo(LINKS.lobby)) return { status: 503, data: { error: "NOT_CONFIGURED" } };
    try {
      const res = await fetch(LINKS.lobby, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      return { status: res.status, data };
    } catch (_) {
      return { status: 0, data: { error: "OFFLINE" } };
    }
  };
  const ERRORS = {
    BAD_ACCOUNT: "口座番号は数字だけで入力してください。",
    BAD_SERVER: "サーバー名を入力してください（MT5 のログイン画面に出ている名前）。",
    BAD_PASSWORD: "パスワードを入力してください。",
    BAD_PLAN: "ご契約のプランを選んでください。",
    NO_CONSENT: "注意事項への承認と、不正な使い方をしないことの確認に、チェックを入れてください。",
    BUSY: "短い時間に何度も送られています。10分ほど待ってから、もう一度お試しください。",
    BAD_ENTRY: "合言葉が違います。ご契約時にお渡ししたものを、もう一度確かめてください。",
    BAD_NAME: "お名前を入力してください。",
    WEAK_PASSWORD: "サイトに入るパスワードは8文字以上にしてください。",
    ACCOUNT_TAKEN: "この口座番号はすでに登録されています。「登録済みの口座でログインする」からお進みください。",
    BAD_CREDENTIALS: "口座番号またはパスワードが違います。",
    SUSPENDED: "この口座はいま利用を止めています。サポート LINE へお問い合わせください。",
    SESSION_EXPIRED: "前回のログインが切れています。もう一度ログインしてください。",
    OFFLINE: "サイトに届きませんでした。通信を確かめて、もう一度お試しください。",
    NOT_CONFIGURED: "いま窓口が立て込んでいます。少し時間をおいてお試しください。",
  };
  const errText = (code) => ERRORS[code] || ERRORS.NOT_CONFIGURED;
  const normDigits = (s) => String(s || "").trim().replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xFEE0));
  const setBusy = (form, on, label) => {
    const btn = form.querySelector("[data-submit]");
    if (!btn) return;
    btn.disabled = on;
    if (on) btn.textContent = label; else btn.innerHTML = btn.dataset.label;
  };

  /* ── 口座の登録を送る（EA の納品のため。サイトの /api/dreamland） ── */
  const mask = (s) => (s.length <= 2 ? "**" : "*".repeat(s.length - 2) + s.slice(-2));
  const submitRegister = async (form) => {
    const f = new FormData(form);
    const err = $("reg-err");
    const account = normDigits(f.get("account"));
    const server = String(f.get("server") || "").trim();
    const password = String(f.get("password") || "");
    const chosen = String(f.get("plan") || "") || planKey() || "";
    const name = String(f.get("name") || "").trim();
    err.textContent = "";
    if (!/^[0-9]{1,13}$/.test(account)) return (err.textContent = ERRORS.BAD_ACCOUNT);
    if (!server) return (err.textContent = ERRORS.BAD_SERVER);
    if (!password) return (err.textContent = ERRORS.BAD_PASSWORD);
    if (!PLANS[chosen]) return (err.textContent = ERRORS.BAD_PLAN);
    if (!name) return (err.textContent = ERRORS.BAD_NAME);
    if (!f.get("agree") || !f.get("fair")) return (err.textContent = ERRORS.NO_CONSENT);
    // すでにパスポートでつながっている口座があれば、記入と突き合わせる（違っても送れるが、はっきり伝える）
    const linked = members.filter((m) => m.done || m.server);
    const sameOne = linked.find((m) => normAcct(m.account) === normAcct(account));
    if (sameOne && sameOne.server && normServer(sameOne.server) !== normServer(server)) {
      if (!form.dataset.warned) { form.dataset.warned = "1"; return (err.textContent = `つながっている口座（${sameOne.account} ／ ${sameOne.server}）とサーバーが一致しないようです。合っていればもう一度「登録して送る」を押してください`); }
    } else if (linked.length && !sameOne) {
      if (!form.dataset.warned) { form.dataset.warned = "1"; return (err.textContent = `つながっている口座（${linked.map((m) => m.account).join("・")}）と一致しないようです。別の口座を登録するなら、もう一度「登録して送る」を押してください`); }
    }
    if (isTodo(LINKS.register)) return show("service", "busy");

    setBusy(form, true, "送っています…");
    try {
      const res = await fetch(LINKS.register, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ account, server, password, plan: chosen, name, platform: osNow() === "win" ? "windows" : osNow() === "mac" ? "mac" : null, consent: true }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const code = data && data.error;
        if (ERRORS[code]) { err.textContent = ERRORS[code]; setBusy(form, false); return; }
        return show("service", "busy");
      }
      app = { no: data.application_no, plan: PLANS[data.plan] ? data.plan : chosen, account: mask(account), accountFull: account, server, name, at: Date.now() };
      saveApp();
      checks.account = true;
      saveChecks();
      renderReady();
      renderGates();
      show("service", "registered");
    } catch (_) {
      show("service", "busy");
    }
  };

  /* ── 合言葉 → プラン ── */
  const submitEntry = async (form) => {
    const err = $("entry-err");
    const entry = String(new FormData(form).get("entry") || "").trim();
    err.textContent = "";
    if (!entry) return (err.textContent = "合言葉を入力してください。");
    setBusy(form, true, "確かめています…");
    const { status, data } = await api({ action: "plan", entry });
    if (status !== 200 || !PLANS[data.plan]) { err.textContent = errText(data.error); setBusy(form, false); return; }
    plan = data.plan;
    savePlan();
    entryPw.set(entry);
    renderGates();
    show("service", "who");
  };

  /* ── 口座をつなぐ：会員登録（またはログイン）→ パスポートを呼ぶ ──
     サイトのパスワードはお客様に決めさせない。口座番号と合言葉から同じものを作って使う
     （別のパソコンでも、同じ口座番号と合言葉なら同じ会員に入れる）。サーバー側は変えていない */
  const derivedPassword = async (account, entry) => {
    const bytes = new TextEncoder().encode(`${account}:${entry}:dreamland-passport`);
    const hash = await crypto.subtle.digest("SHA-256", bytes);
    return "dl" + Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 40);
  };
  const adoptMember = (session, m) => {
    if (m.plan && PLANS[m.plan] && m.plan !== plan) { plan = m.plan; savePlan(); renderGates(); }
    const existing = members.findIndex((x) => x.id === m.id);
    const row = { id: m.id, token: session, account: m.account, name: m.name || "", plan: m.plan || plan, done: existing >= 0 ? members[existing].done : false, server: existing >= 0 ? members[existing].server : "" };
    if (existing >= 0) members[existing] = row; else members.push(row);
    saveMembers();
    checks.account = true;
    saveChecks();
    renderReady();
    return members.indexOf(row);
  };
  const submitSignup = async (form) => {
    const f = new FormData(form);
    const err = $("signup-err");
    const account = normDigits(f.get("account"));
    const name = String(f.get("name") || "").trim();
    err.textContent = "";
    if (!/^[0-9]{1,13}$/.test(account)) return (err.textContent = ERRORS.BAD_ACCOUNT);
    if (!name) return (err.textContent = ERRORS.BAD_NAME);
    if (members.some((m) => String(m.account) === account)) return (err.textContent = "この口座はもうつないでいます。「接続の状態を見る」からつなぎ直せます。");
    const entry = entryPw.get();
    if (!entry) { plan = null; savePlan(); return show("service", "connect"); }
    setBusy(form, true, "登録しています…");
    const password = await derivedPassword(account, entry);
    const { status, data } = await api({ action: "register", account, name, password, entry });
    if (status !== 200) {
      if (data.error === "ACCOUNT_TAKEN") {
        // 登録済みなら、そのまま同じ口座で入る（パスワードは同じ作り方なので一致する）
        const again = await api({ action: "login", account, password });
        if (again.status === 200) return startConnect(adoptMember(again.data.session, again.data.member));
        flow.retryAccount = account; setBusy(form, false); return show("service", "loginpw");
      }
      if (data.error === "BAD_ENTRY") { plan = null; savePlan(); entryPw.set(""); return show("service", "connect"); }
      err.textContent = errText(data.error); setBusy(form, false); return;
    }
    startConnect(adoptMember(data.session, data.member));
  };
  const submitLogin = async (form) => {
    const f = new FormData(form);
    const withPw = form.id === "loginpw";
    const err = $(withPw ? "loginpw-err" : "login-err");
    const account = normDigits(f.get("account"));
    err.textContent = "";
    if (!/^[0-9]{1,13}$/.test(account)) return (err.textContent = ERRORS.BAD_ACCOUNT);
    let password = String(f.get("password") || "");
    if (!withPw) {
      const entry = entryPw.get();
      if (!entry) { plan = null; savePlan(); return show("service", "connect"); }
      password = await derivedPassword(account, entry);
    } else if (!password) return (err.textContent = ERRORS.BAD_PASSWORD);
    setBusy(form, true, "確かめています…");
    const { status, data } = await api({ action: "login", account, password });
    if (status !== 200) {
      if (!withPw && data.error === "BAD_CREDENTIALS") { flow.retryAccount = account; setBusy(form, false); return show("service", "loginpw"); }
      err.textContent = errText(data.error); setBusy(form, false); return;
    }
    if (data.member.plan && plan && data.member.plan !== plan) {
      err.textContent = `この口座は${PLANS[data.member.plan].name}で登録されています。合言葉のプラン（${PLAN().name}）と違うので、サポート LINE へお問い合わせください。`;
      setBusy(form, false);
      return;
    }
    startConnect(adoptMember(data.session, data.member));
  };

  /* ── パスポート（ブリッジ）の様子を中継から受け取る ── */
  const Bridge = {
    ws: null, live: false, status: null, waiting: new Map(), seq: 0, room: null, onChange: null, retry: null, closed: true, welcomed: false, closeCode: 0,
    open(room, session) {
      this.close();
      this.closed = false;
      this.room = room;
      const url = `${RELAY}${RELAY.includes("?") ? "&" : "?"}room=${encodeURIComponent(room)}&session=${encodeURIComponent(session)}`;
      const connect = () => {
        if (this.closed) return;
        let ws;
        try { ws = new WebSocket(url); } catch (_) { this.retry = setTimeout(connect, 5000); return; }
        this.ws = ws; this.welcomed = false;
        ws.onmessage = (ev) => {
          let p; try { p = JSON.parse(ev.data); } catch (_) { return; }
          if (p.type === "welcome") {
            this.welcomed = true;
            const mine = (p.bridges || []).find((b) => String(b.bridgeId) === room);
            this.setLive(!!mine, mine || null);
            return;
          }
          if (p.bridgeId && String(p.bridgeId) !== room) return;
          if (p.type === "bridge_online" || p.type === "bridge_status") return this.setLive(true, p.status || null);
          if (p.type === "bridge_offline") return this.setLive(false, null);
          if (p.type === "ack") {
            const cb = p.id && this.waiting.get(p.id);
            if (cb) { this.waiting.delete(p.id); cb(p); }
            if (p.ok && this.status) { this.status = { ...this.status, ...p }; if (this.onChange) this.onChange(); }
          }
        };
        ws.onclose = (ev) => { if (this.ws !== ws) return; this.ws = null; this.closeCode = ev && ev.code || 0; this.setLive(false, null); if (!this.closed) this.retry = setTimeout(connect, 5000); };
        ws.onerror = () => {};
      };
      connect();
    },
    setLive(live, status) {
      const was = this.live;
      this.live = live;
      this.status = status;
      if (this.onChange) this.onChange(live !== was);
    },
    send(command, extra = {}) {
      return new Promise((resolve) => {
        const ws = this.ws;
        if (!ws || ws.readyState !== WebSocket.OPEN || !this.live) return resolve({ ok: false, error: "not live" });
        const id = `lobby-${++this.seq}`;
        this.waiting.set(id, resolve);
        ws.send(JSON.stringify({ id, command, bridgeId: this.room, ...extra }));
        setTimeout(() => { if (this.waiting.has(id)) { this.waiting.delete(id); resolve({ ok: false, error: "timeout" }); } }, 12000);
      });
    },
    close() {
      this.closed = true;
      if (this.retry) clearTimeout(this.retry);
      if (this.ws) { const ws = this.ws; this.ws = null; try { ws.close(); } catch (_) {} }
      this.live = false; this.status = null; this.waiting.clear();
    },
  };

  /* MT5 側の手順がどこまで済んだか（ブリッジが返した状態だけを見る）。全部済んでいれば null */
  const mt5StepIndex = (s) => {
    if (!s || s.ea_alive !== true) return 0;
    if (s.ea_symbol_ok === false) return 0;
    if (s.terminal_trade_allowed === false || s.ea_state === "自動売買ボタンがオフ") return 1;
    return null;
  };

  /* ── 設置の流れ（サービスカウンターの中だけで進む） ── */
  let consented = false;   // このページを開いているあいだに、注意事項を読んでチェックしたか
  const flow = { idx: -1, phase: null, lines: [], note: "", mt5Index: 0, problem: "", timers: [], retryAccount: "", relaunched: false, startedAt: 0 };
  const FLOW_NODES = new Set(["launch", "waiting", "download", "connecting", "mt5", "failed"]);
  const clearFlowTimers = () => { flow.timers.forEach(clearTimeout); flow.timers = []; };
  const later = (fn, ms) => { const id = setTimeout(fn, ms); flow.timers.push(id); return id; };
  const member = () => members[flow.idx] || null;
  const setPhase = (phase, node = phase) => { flow.phase = phase; show("service", node); };

  const issueAndLaunch = async () => {
    const m = member();
    if (!m) return false;
    const { status, data } = await api({ action: "connect_token", session: m.token });
    if (status === 401) { flow.retryAccount = String(m.account || ""); setPhase("expired"); return false; }
    if (status !== 200) return false;
    const params = new URLSearchParams({ from: SITE, token: data.token });
    try { window.location.href = `aitrader://connect?${params.toString()}`; } catch (_) {}
    return true;
  };

  /* force=true は「お客様が『設置が終わった／もう入れてある』を押した」「設置から戻ってきた」とき。
     それ以外（登録直後など）は、この端末で一度もつないだことが無ければ、呼び出さずにダウンロードの案内から始める。
     お客様は最初はパスポートを持っていないので、「呼び出しています」から始めると何も起きないまま待たせてしまう */
  function startConnect(idx, mode = "auto") {
    const m = members[idx];
    if (!m) return;
    clearFlowTimers();
    flow.idx = idx; flow.lines = []; flow.note = ""; flow.mt5Index = 0; flow.problem = ""; flow.relaunched = false; flow.startedAt = Date.now(); flow.downloadShownAt = 0;
    api({ action: "platform", session: m.token, platform: platformName() });
    Bridge.onChange = onBridgeChange;
    Bridge.open(m.id, m.token);
    const installedHere = !!(checks.tool || members.some((x) => x.done));
    if (mode === "auto") {
      if (!installedHere) { show("service", "download"); return; }   // 最初はパスポートを持っていない
      mode = "launch";                                                // 以前つないだことがある端末は呼び出す
    }
    if (mode === "launch") {
      setPhase("launch");
      issueAndLaunch();
    } else {
      // 開いたパスポートが自分で紐づいて名乗るのを待つだけ（「開きますか？」は出さない）
      setPhase("waiting");
    }
    later(() => {
      if (!(flow.phase === "launch" || flow.phase === "waiting") || Bridge.live) return;
      flow.note = flow.phase === "waiting"
        ? "まだつながっていません。ダウンロードしたファイルを開きましたか？ 開いたのに進まないときは「それでもつながらない（呼び出す）」を押してください"
        : "まだ応答がありません。パスポートが開いていれば、そのままお待ちください。入っていなければ「ダウンロードの手順を見る」から入れてください";
      const el = $("prog"); if (el) el.innerHTML = `<li class="is-wait">${esc(flow.note)}</li>`;
    }, CONNECTOR_WAIT_MS);
  }

  /* いまのツールは、ダウンロードして開いただけでは設置だけして終わり、サイトにも中継にも名乗り出ない。
     だから「設置が終わって、この画面に戻ってきた」ことを合図に、もう一度パスポートを呼び出す
     （ダウンロードを押してから、または案内を出してから DOWNLOAD_SETTLE_MS 経ったあと。呼び直しは RELAUNCH_COOLDOWN_MS に1回） */
  /* ダウンロード。Windows は、ダウンロードするファイル名に合図（使い捨て）を付ける：
       DreamlandPassport-<合図>.exe
     パスポートは初回に自分のファイル名から合図を読み、サイトに確かめて、この口座に紐づく。
     だから「開くだけ」でつながり、サイトから「開きますか？」で呼び出す必要が無い。
     合図を作れなかったとき（通信できない等）と Mac は、名前を付けずにそのまま配る（呼び出す方式で紐づける） */
  const startDownload = async (e, a) => {
    flow.downloadedAt = Date.now();
    const m = member();
    if (osNow() !== "mac" && m && e) {
      e.preventDefault();
      const { status, data } = await api({ action: "connect_token", session: m.token });
      const name = status === 200 && data.token ? `DreamlandPassport-${data.token}.exe` : "DreamlandPassport.exe";
      const tmp = document.createElement("a"); tmp.href = LINKS.winFile; tmp.download = name; tmp.style.display = "none";
      document.body.appendChild(tmp); tmp.click(); tmp.remove();
    }
    flow.note = "ダウンロードが始まりました。ダウンロードしたファイルを開いて、上の手順どおりに進めてください。開き終わったら「設置が終わった（つなぐ）」を押してください";
    const el = $("prog"); if (el) el.innerHTML = `<li class="is-wait">${esc(flow.note)}</li>`;
  };
  // 戻ってきたときに勝手に呼び出さない（ダウンロードしたファイルを開いた直後に、サイト側でも
  // 「開きますか？」が出てしまう）。呼び出すのは「設置が終わった（つなぐ）」を押したときだけ。

  /* 古いツールを「開くだけ」の初回は、部屋を知らないまま既定の部屋に来る。来たら合図を付けて呼び直す */
  const watchDefaultRoom = () => {
    if (flow.phase !== "download" || flow.relaunched) return;
    const http = RELAY.replace(/^wss:/, "https:").replace(/^ws:/, "http:").replace(/\/app(\?.*)?$/, "");
    fetch(`${http}/health?room=${encodeURIComponent(DEFAULT_ROOM)}`, { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then((body) => {
        if (!body || !body.room || !body.room.bridge || flow.phase !== "download" || flow.relaunched) return;
        if (typeof body.room.since === "number" && body.room.since < flow.startedAt - DEFAULT_ROOM_FRESH_MS) return;
        flow.relaunched = true;
        flow.note = "パスポートが起動しました。ブラウザに「ドリームランド・パスポート を開きますか？」と出たら「開く」を押してください";
        const el = $("prog"); if (el) el.innerHTML = `<li class="is-wait">${esc(flow.note)}</li>`;
        issueAndLaunch();
      })
      .catch(() => {})
      .finally(() => { if (flow.phase === "download") later(watchDefaultRoom, DEFAULT_ROOM_POLL_MS); });
  };

  function onBridgeChange(liveChanged) {
    if (flow.idx < 0) return;
    if (Bridge.live && (flow.phase === "launch" || flow.phase === "waiting" || flow.phase === "download" || flow.phase === "failed")) return checkStatus();
    if (flow.phase === "mt5" && Bridge.live) return watchMt5();
    if (!Bridge.live && liveChanged && flow.phase === "mt5") { flow.note = "パスポートとの通信が切れました。ツールが動いているか確かめてください"; }
  }

  /* 口座の登録（申込）で記入した口座と、パスポートでつながった口座の突き合わせ。口座番号とサーバーだけ見る */
  const normAcct = (a) => String(a == null ? "" : a).replace(/\D/g, "");
  const normServer = (s) => String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " ");
  const sameAccount = (acct1, srv1, acct2, srv2) => normAcct(acct1) === normAcct(acct2) && (!normServer(srv1) || !normServer(srv2) || normServer(srv1) === normServer(srv2));
  const mismatchText = (acct, srv) => `口座の登録で記入した口座（${app.accountFull || app.account} ／ ${app.server || "サーバー未記入"}）と、つながっている口座（${acct} ／ ${srv || "サーバー不明"}）が一致しないようです。登録し直すか、MT5 のログインをご確認ください`;

  async function checkStatus() {
    setPhase("connecting");
    const ack = await Bridge.send("get_status");
    if (flow.phase !== "connecting") return;
    const account = ack.account != null && String(ack.account) !== "" ? String(ack.account) : "";
    const name = ack.terminal_name ? `（${ack.terminal_name}）` : "";
    flow.lines = [
      { text: ack.mt5_ready ? `MT5 に接続しました${name}` : "MT5 に接続できませんでした", ok: !!ack.mt5_ready },
      { text: account ? `口座 ${account}${ack.server ? ` ／ ${ack.server}` : ""}` : "口座情報を読み取れませんでした", ok: !!account },
      { text: ack.ea_installed ? "運用システム（EA）を確認しました" : "運用システム（EA）がまだ置かれていません。パスポートを起動し直してください", ok: !!ack.ea_installed },
    ];
    if (!ack.ok || !ack.mt5_ready || !account) return setPhase("failed");
    const m = member();
    const mine = m && m.account != null && String(m.account) === account;
    if (m && !mine) {
      flow.lines.push({ text: `つながっている MT5 の口座（…${account.slice(-2)}）が、登録した口座（${tail2(m.account)}）と違います。その口座でログインしている MT5 を選んでください`, ok: false });
      return setPhase("failed");
    }
    if (m) { m.server = String(ack.server || ""); saveMembers(); }
    // 申込（口座の登録）があれば、その口座とつながった口座を突き合わせる。違っても止めないが、はっきり伝える
    mismatch = !!(app && (app.accountFull || app.account) && !sameAccount(app.accountFull || "", app.server, account, ack.server));
    if (mismatch) flow.lines.push({ text: mismatchText(account, ack.server), ok: false });
    checks.tool = true; saveChecks(); renderReady();
    const idx = mt5StepIndex(ack);
    if (idx == null) return finishConnect();
    flow.mt5Index = idx;
    setPhase("mt5");
    pollMt5();
  }

  /* MT5 側の手順（EA を載せる・アルゴ取引を ON）は、パスポートからの押し出しを待つだけでなく、
     数秒ごとに自分から状態を取りに行く（本体サイトと同じ）。押し出しが届かない環境で
     「設置が終わっているのに進まない」のを防ぐ */
  function pollMt5() {
    if (flow.phase !== "mt5") return;
    later(async () => {
      if (flow.phase !== "mt5") return;
      if (Bridge.live) {
        const ack = await Bridge.send("get_status");
        if (flow.phase === "mt5" && ack && ack.ok) { Bridge.status = { ...(Bridge.status || {}), ...ack }; watchMt5(); }
      }
      pollMt5();
    }, MT5_POLL_MS);
  }

  function watchMt5() {
    const s = Bridge.status;
    const idx = mt5StepIndex(s);
    flow.problem = s && s.ea_problem ? String(s.ea_problem) : "";
    if (idx == null) return finishConnect();
    if (idx !== flow.mt5Index || flow.problem) { flow.mt5Index = idx; const d = $("docs"); if (d && flow.phase === "mt5") { d.innerHTML = DOCS.mt5steps(); } }
  }

  function finishConnect() {
    const m = member();
    if (m) { m.done = true; saveMembers(); }
    checks.tool = true; checks.ea = true; checks.algo = true; saveChecks(); renderReady();
    clearFlowTimers();
    flow.phase = "done";
    show("service", "done");
  }

  /* ── 会話 ── */
  const panel = $("panel"), veil = $("veil"), say = $("say"), docs = $("docs"), choicesEl = $("choices"), typingEl = $("typing");
  const navBtns = [...document.querySelectorAll(".nav button")];
  let who = null, timer = null, finishTyping = null, returnFocus = null;

  const markHere = (key, planHint) => {
    pins.forEach((p) => p.classList.toggle("is-here", p.dataset.spot === key && (!p.dataset.plan || p.dataset.plan === planHint)));
    navBtns.forEach((b) => b.classList.toggle("is-active", b.dataset.spot === key));
    $("instruction").style.opacity = key ? "0" : "";
  };

  const typeText = (text) => new Promise((resolve) => {
    clearInterval(timer);
    finishTyping = () => { clearInterval(timer); timer = null; finishTyping = null; say.textContent = text; typingEl.textContent = ""; resolve(); };
    if (reduced) return finishTyping();
    say.textContent = "";
    typingEl.textContent = "…";
    let i = 0;
    timer = setInterval(() => { i += 2; say.textContent = text.slice(0, i); if (i >= text.length) finishTyping(); }, 26);
  });

  /* choices が "os:win,mac" なら、Windows / Mac の2択（行き先はその2つのノード） */
  const choiceList = (node) => {
    const c = val(node.choices);
    if (typeof c === "string" && c.startsWith("os:")) {
      const [w, m] = c.slice(3).split(",");
      return [["Windows", w, osNow() === "win" ? "pick" : ""], ["Mac", m, osNow() === "mac" ? "pick" : ""], ["ほかのもの", "start"]];
    }
    return c || [];
  };

  /* 搭乗の判定：チェックが揃っていなければ notyet、プランが決まっていなければ plan、揃っていれば pass */
  const boardNode = (force) => {
    if (!force && doneCount() !== CHECKS.length) return "notyet";
    if (!planKey()) return "plan";
    return "pass";
  };

  const wireForm = (form, onSubmit) => {
    form.addEventListener("submit", (e) => { e.preventDefault(); onSubmit(form); });
    const btn = form.querySelector("[data-submit]"); if (btn) btn.dataset.label = btn.innerHTML;
    form.querySelectorAll("[data-eye]").forEach((eye) => {
      const pw = eye.parentElement.querySelector('input[type="password"], input[type="text"]');
      eye.addEventListener("click", () => { const open = pw.type === "password"; pw.type = open ? "text" : "password"; eye.textContent = open ? "隠す" : "表示"; });
    });
  };

  const show = async (staffKey, nodeKey) => {
    if (nodeKey === "board") nodeKey = boardNode(false);
    if (nodeKey === "board!") nodeKey = boardNode(true);
    if (nodeKey === "connect" && planKey() && plan) nodeKey = "who";   // 合言葉が済んでいれば、プランの案内から
    if (staffKey === "service" && (nodeKey === "signup" || nodeKey === "login") && !consented) nodeKey = "terms";   // 注意事項は必ず通る
    if (staffKey === "service" && isPhone && (nodeKey === "terms" || nodeKey === "signup" || nodeKey === "login" || nodeKey === "loginpw" || nodeKey === "launch" || nodeKey === "waiting" || nodeKey === "download")) nodeKey = "pc";   // スマホでは発行できない
    if (nodeKey.startsWith("door:")) {
      gatePlan = nodeKey.slice(5);
      markHere("gate", gatePlan);
      nodeKey = planKey() && planKey() !== gatePlan ? "wrong" : "door";
    }
    if (!(staffKey === "service" && FLOW_NODES.has(nodeKey))) { if (flow.phase && FLOW_NODES.has(flow.phase)) clearFlowTimers(); if (!FLOW_NODES.has(nodeKey)) flow.phase = nodeKey === "done" ? "done" : null; }
    const s = STAFF[staffKey], node = SCRIPT[staffKey][nodeKey];
    if (!node) return;
    if (who !== staffKey) {
      who = staffKey;
      $("p-label").textContent = s.role.split(" ")[0];
      $("p-name").innerHTML = `<small>${esc(s.en)}</small>${esc(s.name)}`;
      $("p-role").textContent = s.role;
      $("p-img").src = s.img;
      panel.style.setProperty("--light", s.light);
    }
    docs.innerHTML = "";
    choicesEl.innerHTML = "";
    const token = (show.seq = (show.seq || 0) + 1);
    await typeText(val(node.say));
    if (token !== show.seq) return;   // 文字送りの途中で別の台詞に移った
    if (node.docs) {
      docs.innerHTML = DOCS[node.docs]();
      applyLinks(docs);
      docs.querySelectorAll("[data-check]").forEach((box) => box.addEventListener("change", () => {
        checks[box.dataset.check] = box.checked;
        saveChecks();
        renderReady();
      }));
      const flyBtn = docs.querySelector("[data-fly]");
      if (flyBtn) flyBtn.addEventListener("click", () => fly(flyBtn.dataset.fly));
      const reg = docs.querySelector("form#reg");     if (reg) wireForm(reg, submitRegister);
      const ent = docs.querySelector("form#entry");   if (ent) wireForm(ent, submitEntry);
      const sgn = docs.querySelector("form#signup");  if (sgn) wireForm(sgn, submitSignup);
      const lgn = docs.querySelector("form#login");   if (lgn) wireForm(lgn, submitLogin);
      const lpw = docs.querySelector("form#loginpw"); if (lpw) wireForm(lpw, submitLogin);
      const shareBtn = docs.querySelector("[data-share]"), copyBtn = docs.querySelector("[data-copy]");
      const pageUrl = () => location.origin + location.pathname + "#connect";
      if (shareBtn) shareBtn.addEventListener("click", async () => {
        try { if (navigator.share) { await navigator.share({ title: "ドリームランド 渡航手続き", text: "パソコンで開いて、パスポートの発行を進めてください", url: pageUrl() }); return; } } catch (_) {}
        copyBtn && copyBtn.click();
      });
      if (copyBtn) copyBtn.addEventListener("click", async () => {
        const note = $("copy-note");
        try { await navigator.clipboard.writeText(pageUrl()); note.textContent = "コピーしました。パソコンのブラウザに貼り付けて開いてください"; }
        catch (_) { note.textContent = pageUrl(); }
      });
      const trm = docs.querySelector("form#terms");
      if (trm) {
        const btn = trm.querySelector("[data-submit]"), boxes = [...trm.querySelectorAll('input[type="checkbox"]')];
        boxes.forEach((b) => b.addEventListener("change", () => { btn.disabled = !boxes.every((x) => x.checked); }));
        trm.addEventListener("submit", (e) => { e.preventDefault(); if (!boxes.every((x) => x.checked)) return; consented = true; show("service", "signup"); });
        const firstBox = boxes[0]; if (firstBox) firstBox.focus({ preventScroll: true });
      }
      docs.querySelectorAll("[data-reconnect]").forEach((b) => b.addEventListener("click", () => startConnect(Number(b.dataset.reconnect), "launch")));
      docs.querySelectorAll("[data-door]").forEach((b) => b.addEventListener("click", () => show("gate", "door:" + b.dataset.door)));
      docs.querySelectorAll("[data-os]").forEach((b) => b.addEventListener("click", () => { osChoice = b.dataset.os; show(staffKey, nodeKey); }));
      const dl = docs.querySelector("[data-download]");
      if (dl) { dl.removeAttribute("target"); dl.setAttribute("download", ""); dl.addEventListener("click", (e) => startDownload(e, dl)); }
      if (nodeKey === "download" && staffKey === "service") { flow.phase = "download"; flow.downloadShownAt = flow.downloadShownAt || Date.now(); later(watchDefaultRoom, DEFAULT_ROOM_POLL_MS); }
    }
    choiceList(node).forEach(([label, to, flag], i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice" + (flag === "go" ? " choice--go" : "");
      b.style.animationDelay = (i * 40) + "ms";
      b.innerHTML = esc(label) + (flag === "pick" ? '<span class="pick">あなたのパソコン</span>' : "");
      b.addEventListener("click", () => act(staffKey, to));
      choicesEl.appendChild(b);
    });
    const first = docs.querySelector("form input") || docs.querySelector("[data-fly]") || choicesEl.querySelector(".choice");
    if (first) first.focus({ preventScroll: true });
  };

  const PLACE = { info: "インフォメーション", service: "サービスカウンター", gate: "搭乗ゲート" };
  const appEl = $("app"), world = $("world"), travel = $("travel");
  const focusSpot = (spot) => {
    const pin = pins.find((p) => p.dataset.spot === spot);
    if (!pin) return;
    const r = pin.getBoundingClientRect(), a = appEl.getBoundingClientRect();
    const x = ((r.left + r.width / 2 - a.left) / a.width) * 100, y = ((r.top + r.height / 2 - a.top) / a.height) * 100;
    world.style.transformOrigin = `${x.toFixed(1)}% ${y.toFixed(1)}%`;
    appEl.classList.add("is-focus");
  };
  const unfocus = () => appEl.classList.remove("is-focus");
  let travelTimer = null;
  /* 窓口へ移動してから話しかける。別の窓口にいたときは、いったん引いてから寄る */
  const goTo = (spot, nodeKey = "start") => {
    if (!STAFF[spot]) return;
    clearTimeout(travelTimer);
    clearInterval(timer);
    if (!panel.hidden) { panel.hidden = true; veil.classList.remove("show"); veil.hidden = true; }
    who = null;
    markHere(spot, nodeKey.startsWith("door:") ? nodeKey.slice(5) : null);
    if (reduced) { focusSpot(spot); return open(spot, nodeKey); }
    unfocus();
    $("travel-text").textContent = PLACE[spot] + "へ";
    travel.hidden = true; void travel.offsetWidth; travel.hidden = false;   // アニメーションを最初から
    setTimeout(() => focusSpot(spot), 60);
    travelTimer = setTimeout(() => { travel.hidden = true; open(spot, nodeKey); }, 760);
  };

  const open = (staffKey, nodeKey = "start") => {
    if (!returnFocus) returnFocus = document.activeElement;
    if (staffKey !== "gate") gatePlan = null;
    markHere(staffKey, nodeKey.startsWith("door:") ? nodeKey.slice(5) : null);
    veil.hidden = false;
    panel.hidden = false;
    requestAnimationFrame(() => veil.classList.add("show"));
    panel.scrollTop = 0;
    panel.focus({ preventScroll: true });
    show(staffKey, nodeKey);
  };

  const close = () => {
    clearInterval(timer);
    panel.hidden = true;
    veil.classList.remove("show");
    veil.hidden = true;
    who = null;
    gatePlan = null;
    markHere(null);
    unfocus();
    if (returnFocus && returnFocus.focus) returnFocus.focus({ preventScroll: true });
    returnFocus = null;
  };

  const act = (staffKey, to) => {
    if (to === "close") return close();
    if (to === "next") to = nextStep();
    if (to === "entry!") { plan = null; savePlan(); entryPw.set(""); renderGates(); return show("service", "connect"); }
    if (to === "later") { second = "later"; saveSecond(); return show("service", "later"); }
    // 「設置が終わった（つなぐ）」：Windows は開いたパスポートが自分で紐づくので待つだけ。Mac は呼び出す
    if (to === "launch") { const i = flow.idx >= 0 ? flow.idx : members.length - 1; return i >= 0 ? startConnect(i, osNow() === "mac" ? "launch" : "wait") : show("service", "connect"); }
    if (to === "relaunch") { const i = flow.idx >= 0 ? flow.idx : members.length - 1; return i >= 0 ? startConnect(i, "launch") : show("service", "connect"); }
    if (to === "download" && staffKey === "service") { if (flow.idx < 0 && members.length) flow.idx = members.length - 1; return show("service", "download"); }
    if (to.startsWith("reconnect:")) return startConnect(Number(to.slice(10)), "launch");
    if (to.startsWith("@")) {
      const [target, node] = to.slice(1).split(":");
      return goTo(target, node || "start");   // 別の窓口へ移動してから話す
    }
    if (to.startsWith("door:") && staffKey !== "gate") return goTo("gate", to);
    show(staffKey, to);
  };

  /* 文字送り中に押したら、全文を出す */
  panel.addEventListener("click", (e) => { if (finishTyping && !e.target.closest("a,button,label,input,form")) finishTyping(); });
  $("close").addEventListener("click", close);
  veil.addEventListener("click", close);
  document.addEventListener("keydown", (e) => {
    if (panel.hidden) return;
    if (e.key === "Escape") return close();
    if ((e.key === "Enter" || e.key === " ") && finishTyping && document.activeElement === panel) { e.preventDefault(); finishTyping(); }
    if (e.key === "Tab") {
      const f = [...panel.querySelectorAll("button, a[href], a[tabindex], input")].filter((el) => el.offsetParent !== null && !el.disabled && el.type !== "radio" && el.type !== "checkbox");
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  document.querySelectorAll("[data-spot]").forEach((el) => el.addEventListener("click", () => {
    returnFocus = el;
    goTo(el.dataset.spot, "start");
  }));
  $("ready").addEventListener("click", (e) => { returnFocus = e.currentTarget; goTo("gate"); });

  /* 前回つないだ口座があれば、セッションが生きているか確かめておく（切れていればログインをお願いする） */
  members.forEach((m) => { api({ action: "me", session: m.token }).then(({ status, data }) => {
    if (status === 200 && data.member) { m.name = data.member.name || m.name; m.account = data.member.account ?? m.account; if (data.member.plan) m.plan = data.member.plan; saveMembers(); }
    if (status === 401) { m.expired = true; }
  }); });

  /* ロビーに入ったら、まずインフォメーションのユイが声をかける。
     URL の末尾が #service / #connect / #gate / #first / #crystal なら、そこから始める（LINE で直接送る用） */
  const startAt = location.hash.slice(1);
  const first = PLANS[startAt] ? ["gate", "door:" + startAt] : startAt === "connect" ? ["service", "connect"] : STAFF[startAt] ? [startAt, "start"] : ["info", "start"];
  setTimeout(() => goTo(first[0], first[1]), reduced ? 0 : 500);

  /* ── 出発 ── */
  function fly(planKeyArg) {
    const p = PLANS[planKeyArg] || PLAN();
    close();
    const url = LINKS[p.link];
    const flyEl = $("fly"), link = $("fly-link");
    $("fly-flight").textContent = `${p.flight} · ${p.en} · NOW BOARDING`;
    $("fly-sub").textContent = `${p.name}のお客様、まもなく出発いたします`;
    flyEl.classList.toggle("fly--crystal", p.key === "crystal");
    flyEl.classList.toggle("fly--first", p.key !== "crystal");
    if (isTodo(url)) link.removeAttribute("href"); else link.href = url;
    flyEl.hidden = false;
    if (!isTodo(url)) setTimeout(() => { window.location.href = url; }, reduced ? 600 : 3500);
    else setTimeout(() => { flyEl.hidden = true; }, 3800);
  }
})();
</script>
</body>
</html>
