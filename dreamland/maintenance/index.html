<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ドリームランド｜メンテナンス中</title>
<style>
  :root{--gold:#cbbb98;--gold-deep:#aa9461;--cream:#fffaf0;--cream-2:#fffdf2;--teal:#69b4bc;--teal-b:#578d9a;--ink:#2f3a46;
    --serif:"Hiragino Mincho ProN","Yu Mincho",serif;--sans:"Hiragino Sans","Yu Gothic",sans-serif}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);color:var(--ink);background:radial-gradient(120% 90% at 50% 0%,#eef4fb 0%,#dbe5f2 60%,#cfdbea 100%);
    display:grid;place-items:center;padding:24px;box-sizing:border-box;line-height:1.9}
  .card{max-width:640px;width:100%;background:rgba(255,253,242,.92);border:1px solid rgba(192,165,110,.45);border-radius:18px;
    box-shadow:0 18px 50px rgba(90,110,140,.18);padding:40px 32px;text-align:center}
  .en{font-family:Georgia,"Times New Roman",serif;letter-spacing:.22em;font-size:12px;color:var(--gold-deep)}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(22px,3vw,28px);margin:10px 0 14px;letter-spacing:.06em}
  p{font-size:16px;margin:0 0 10px}
  .note{font-size:14px;color:#6b7785}
  .enter{display:inline-block;margin-top:22px;min-height:48px;line-height:48px;padding:0 28px;border-radius:999px;
    background:linear-gradient(135deg,var(--teal),var(--teal-b));color:#fff;text-decoration:none;font-weight:700;font-size:16px;
    box-shadow:0 8px 20px rgba(87,141,154,.3)}
  .ring{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;
    font-family:Georgia,serif;color:var(--gold-deep);letter-spacing:.1em;font-size:11px}
</style>
</head>
<body>
  <main class="card">
    <div class="ring">DL</div>
    <div class="en">DREAMLAND · NOTICE</div>
    <h1>ドリームランドは現在メンテナンス中です</h1>
    <p>ただいま搭乗口の先を整えています。再開しだい、お持ちの搭乗券でそのままご案内いたします。</p>
    <p class="note">お手続き（口座の登録・パスポートの発行）はロビーでこれまでどおり進められます。</p>
    <a class="enter" href="../">ロビーへ戻る ›</a>
  </main>
</body>
</html>
